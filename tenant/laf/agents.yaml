# 이 배포가 미리 만들어 내려주는 봇 — 없다.
#
# 예전에는 여기에 일상 비서·지식·리스크 분석가 셋이 있었고, 시스템 소유라 사람이
# 고칠 수 없었다. 그게 제품 방향과 반대라 걷어냈다: 봇은 **아무것도 설정되지 않은,
# 무엇이든 할 수 있는 상태**로 시작하고, 무엇이 될지는 그 봇을 만든 사람이 정한다.
# 첫 봇은 온보딩에서 만들어진다.
#
# 계정당 좌석은 다섯이다(`computer/assignment.ts`). 여기에 봇을 하나 적을 때마다
# 사람 몫이 하나 줄어든다는 뜻이고, 그것만으로도 이 목록을 비워 둘 이유가 된다.
#
# 목록에서 뺀 봇은 사라지지 않고 **풀려난다** — `packageId`가 지워져 그 계정의 평범한
# 봇이 되고, 대화는 그대로 남으며, 사람이 이름을 바꾸거나 지울 수 있다.
# `synchronizeTenantPackage`를 보라.
