model:
  provider: openai
  credential_secret_ref: openai-api-key
  # THE ONE DEFAULT. This line is where the deployment's model is decided when `.env` says nothing.
  #
  # There were four of them and they disagreed: `gpt-4.1` here, `gpt-5.5` in agent-bot, `gpt-5.5`
  # in the eval, `gpt-5.5` in docker-compose — while every deployment actually runs
  # `z-ai/glm-5.3-flash` through OpenRouter, chosen by the ritual in docs/laf/eval-pack.md and
  # recorded in 4ef8c4c. Four defaults meant the value nobody set was different in each half of the
  # product, and no one of them was the truth. agent-bot and the eval now carry none and refuse to
  # run without BOT_MODEL; this is the fallback, and it is the model the eval certified.
  #
  # Xiaomi's MiMo-V2.6-Pro since 2026-09-25, the owner's decision, put through the same ritual
  # (docs/laf/eval-pack.md, "MiMo-V2.6-Pro").
  default_model: ${BOT_MODEL:-xiaomi/mimo-v2.6-pro}
  # Whether this deployment's model reasons, and therefore takes an effort setting.
  #
  # AN ASSERTION, NOT A DESCRIPTION. The model provider decides on its own whether to send an effort
  # by pattern-matching the model's name — o-series, or gpt-5 and up — and sends nothing for anything
  # else. Measured against the wire: `gpt-5` carried the setting and `stealth/ox-alpha` carried
  # nothing at all. The product's model is served by us under a name only we choose, so no heuristic
  # over model names can ever recognise it, and this line is how the deployment says so.
  #
  # True also puts the system prompt in the developer role, which is what the provider does for every
  # model it recognises as reasoning. Set it false on a model that does not reason: nothing is sent,
  # and the control disappears from the Bot's profile rather than sitting there doing nothing.
  #
  # FALSE BY DEFAULT SINCE THE DEFAULT IS MIMO, which reasons but defines no effort: thinking is on
  # or off, and every effort word measured through OpenRouter thought the same length
  # (agent-bot/src/transcript.ts `MODEL_EFFORTS`). Three settings that make one request are a control
  # that lies, so it is not drawn, and MiMo thinks as it does by default — on. A deployment on a model
  # with levels of its own (GLM-5.3: low, high, max) sets BOT_MODEL_EFFORT=true.
  supports_effort: ${BOT_MODEL_EFFORT:-false}
  # The model this server asks on its own account when Jev is off or cannot answer: auto-review's
  # judge and compaction's stand-in (server/src/server-model-calls.ts). Not the Bot's model, because
  # neither job is the Bot's: a yes/no in front of a waiting Bot, and a keep-or-drop inside a 90 s
  # bound. Measured 2026-09-25 (docs/laf/eval-pack.md, "서버 쪽 호출"): on MiMo-V2.6-Pro the judge
  # took a median 5.3 s and the stand-in outlived its bound 2 times in 3; GLM-5.3-Flash at `low`
  # answered both in about a second with no false allow.
  server_model: ${SERVER_MODEL:-z-ai/glm-5.3-flash}
  # Whether that model takes an effort. GLM-5.3-Flash does (low, high, max); the calls send `low`.
  server_model_effort: ${SERVER_MODEL_EFFORT:-true}
  # Which model judges a Bot's "do not ask me about" instruction. Defaults to the server model.
  #
  # ITS OWN, BECAUSE IT IS A DIFFERENT JOB. Deciding whether one action is read-only is a
  # classification, and asking a flagship reasoning model to do it costs both money and a Bot
  # standing still: measured against the model this deployment serves, a yes/no took between ten
  # and thirty seconds, which is longer than a person often takes to press the button itself.
  #
  # Unset, it is the server model above, which is small and fast; set, it overrides that for the
  # review alone, and `server_model_effort` still says whether it is sent an effort.
  review_model: ${REVIEW_MODEL:-}
  # The decisions model — TypeSafe's Jev through OpenRouter, on the key above — asked only when
  # JEV_ENABLED=on: compaction's keep-or-drop and auto-review's triage (docs/laf/eval-pack.md).
  #
  # A DATED SNAPSHOT, NOT `jev-latest`. Every threshold held against it is a measurement of this one
  # (server/src/computer/jev-auto-review.ts `JEV_CALIBRATION`); an ID with no measured bar allows
  # nothing. Changing this line is re-running `bun run eval:auto-review` and `eval:compaction`.
  decision_model: typesafe/jev-1.13-20260917
