# Bugbot reads this from the pull request's BASE branch, so a pull request cannot
# change how it is itself reviewed. The rules it reviews by are in ../BUGBOT.md.
# Why each value: CLAUDE.md, "How a change lands".
version: 1
triggers:
  # A review is asked for (`bugbot run`) on a finished head, at merge time. The
  # "run only when mentioned" switch is the dashboard's; these two are what holds
  # if that switch is ever off: no drafts, and never push by push.
  drafts: false
  frequency: oncePerPr
review:
  # What a review costs follows how hard it reads (about a dollar a run at the default, 2026-10).
  # Hard where a miss costs a person something, light where the gate already reads the change.
  effort: smart
  smartPrompt: >-
    Use high effort when the change touches sign-in or sessions, secrets or saved logins, the
    boundary and approvals, the audit trail, money or budgets, a database migration, deleting or
    forgetting data, what the Bot reads (shared/prompt, shared/tools), or the computer gateway
    (server/src/computer, agent-computer). Use low effort when the change is only documentation,
    tests, evaluation scripts, copy or styling. Use default effort for everything else.
  # A second pass reads what changed since the first. A verdict belongs to the
  # patch it read.
  incremental: true
prSummary:
  # The description is the template, filled in by whoever did the work. Nothing
  # rewrites it.
  mode: disabled
autofix:
  # A reviewer does not push. Findings are claims, sorted before anything is fixed.
  mode: disabled
