# A company hub: one VM holding what a company's members share, reached by their own VMs over
# HTTPS with a pass each (hub/src/auth.ts). Three services — its Postgres, the hub process and
# Caddy in front — and nothing of a person's VM: no Bot, no browser, no model key, no app.
#
# Its own project name, so on a machine that also runs docker-compose.yml the two never share a
# container, a network or a volume.
#
#   docker compose -f docker-compose.hub.yml up -d
#
# What a hub's `.env` holds: HUB_PUBLIC_ORIGIN (the address members reach it at, scheme included),
# HUB_FLEET_SECRET (this hub's registry key, derived by laf-control — never the master),
# POSTGRES_PASSWORD, IMAGE_TAG, and optionally HUB_PRIVATE_IP (given to members in the same
# private network to try first).
#
# What it reads from the host besides: /etc/laf-hub-blob-remote, the write-only door into the
# company's blob bucket that laf-control installs (root, 600) — handed to the hub by the `door`
# service below.
name: laf-hub

# Every service's logs, bounded, for the reason docker-compose.yml gives: a full disk stops Postgres.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
    logging: *logging
    # docker-compose.yml's tuning, for a 1 OCPU / 3 GB hub: a quarter of the ceiling for shared
    # buffers, the planner told what page cache the cgroup can really hold, SSD page costs, and any
    # statement over a second written to the log.
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "effective_cache_size=768MB",
        "-c",
        "work_mem=8MB",
        "-c",
        "random_page_cost=1.1",
        "-c",
        "log_min_duration_statement=1000",
      ]
    mem_limit: 1g
    oom_score_adj: -500
    shm_size: 256m
    ports:
      # Loopback only, as on a person's VM: the hub reaches it on the compose network, an operator
      # through the SSH tunnel they are already in.
      - "127.0.0.1:${HUB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - hub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The hub. It applies its own migrations at boot, so there is no migrate service.
  hub:
    image: ghcr.io/laf-labs/openbot-hub:${IMAGE_TAG:-stable}
    build:
      context: .
      dockerfile: hub/Dockerfile
    environment:
      DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD:-hub}@postgres:5432/hub
      PORT: "7200"
      HUB_PUBLIC_ORIGIN: ${HUB_PUBLIC_ORIGIN:-http://localhost}
      HUB_FLEET_SECRET: ${HUB_FLEET_SECRET:-}
      HUB_PRIVATE_IP: ${HUB_PRIVATE_IP:-}
      # Team files, by content hash (hub/src/files/store.ts). Unset, files and search are refused.
      HUB_FILES_DIR: /srv/hub/files
      # The blob bucket's door, as the `door` service leaves it (hub/src/files/mirror.ts). Read on
      # every mirror pass; absent, nothing is copied and `/metrics` says `mirror: "off"`.
      HUB_BLOB_DOOR_FILE: /run/laf-door/blob-remote
      # `PUT /hub/v1/files` on a listener of its own, which streams a body to the volume without
      # holding it in memory (hub/src/uploads.ts). Reached only through `web` (hub/Caddyfile).
      HUB_UPLOAD_PORT: "7201"
      IMAGE_TAG: ${IMAGE_TAG:-stable}
    volumes:
      # Owned by the image's user (uid 1000) on first mount (hub/Dockerfile). laf-control: put the hub
      # VM's block volume under this named volume (or bind it at /srv/hub/files, chowned 1000:1000).
      - hub-files:/srv/hub/files
      - hub-door:/run/laf-door:ro
    ports:
      # Loopback only: `GET /hub/v1/metrics` is read here by the operator's collector over SSH, and
      # the front door refuses that path from outside (hub/Caddyfile).
      - "127.0.0.1:${HUB_API_PORT:-7200}:7200"
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7200/hub/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Hands the blob bucket's door from the host to the hub. laf-control writes it root-only (600) at
  # /etc/laf-hub-blob-remote, the hub runs as uid 1000 and cannot read that, and the file may not
  # exist yet: laf-control's `hub create` mints it after this stack is up, `hub offsite` on a hub
  # already running. So not a bind of the file itself — Docker would make a DIRECTORY at that path
  # on the host when it is missing, and laf-control's "is a door installed" check would then find
  # one and never write it. Instead this reads /etc (read-only) once a minute and keeps a copy the
  # hub's user can read on a memory-backed volume (never the disk), or removes the copy when the
  # door is gone. No network, nothing but the one copy: root only because the door is root's.
  door:
    image: ghcr.io/laf-labs/openbot-hub:${IMAGE_TAG:-stable}
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    # `chgrp bun`: the copy is root's, readable by the hub's group (0440), so this can compare it.
    cap_add: [CHOWN]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        src=/host-etc/laf-hub-blob-remote
        dst=/run/laf-door/blob-remote
        while :; do
          if [ -f "$$src" ] && [ -s "$$src" ]; then
            cmp -s "$$src" "$$dst" || { rm -f "$$dst.new" && cp "$$src" "$$dst.new" && chmod 0440 "$$dst.new" && chgrp bun "$$dst.new" && mv -f "$$dst.new" "$$dst"; }
          else
            rm -f "$$dst"
          fi
          sleep 60 & wait $$!
        done
    volumes:
      - /etc:/host-etc:ro
      - hub-door:/run/laf-door
    logging: *logging
    mem_limit: 32m
    restart: unless-stopped

  # The front door: TLS and the one proxy. The stock image with the hub's Caddyfile mounted — the
  # hub has no pages to bake into an image of its own. Pinned to the digest app/Dockerfile uses.
  web:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "${HUB_HTTP_PORT:-80}:80"
      - "${HUB_HTTPS_PORT:-443}:443"
    environment:
      HUB_PUBLIC_ORIGIN: ${HUB_PUBLIC_ORIGIN:-http://localhost}
    volumes:
      - ./hub/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account, kept across restarts (docker-compose.yml says why).
      - hub-caddy-data:/data
      - hub-caddy-config:/config
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:2021/hub/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    mem_limit: 256m
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hub-postgres-data:
  hub-files:
  # The door's copy (the `door` service): in memory, so the secret is on the disk only where
  # laf-control put it.
  hub-door:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,mode=0755"
  hub-caddy-data:
  hub-caddy-config:
