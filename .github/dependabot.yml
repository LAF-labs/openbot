version: 2

# Nothing here watched a dependency before this file existed: the images pinned nothing, the
# workflows pin action SHAs by hand, and a published advisory reached this repository only when
# somebody happened to read one.
#
# And for its first week this file watched nothing either. Measured 2026-09-10: one Monday past its
# schedule, zero pull requests, zero `dependabot/*` branches, and no "Dependabot Updates" run in
# Actions at all — while `bun audit` held three fixed advisories against the API server's `hono`
# for fifteen days. The manifest ecosystem was `npm`, and the only lockfile here is `bun.lock`,
# which Dependabot's npm updater does not read. `bun` is the ecosystem that does. Alerts and
# security updates are a repository setting, not a line here; both are on, and
# `tests/dockerfiles.test.ts` reads this file against the Dockerfiles so a new image cannot be
# added without the entry that re-pins its base.
#
# Weekly and grouped, on purpose. Ungrouped, a monorepo this size opens a dozen pull requests every
# Monday, each needing its own CI run and its own review, and the pile is how a person learns to
# ignore the whole channel. One pull request per ecosystem per week is a thing somebody actually
# reads — and CI, which runs the same checks that gate an image, is what says whether it is safe.
updates:
  # Bun reads the same manifests, and the root manifest declares the workspaces, so one entry
  # covers app, server, agent-bot, agent-computer and desktop.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    # A week between a release and a pull request about it: a package pulled the day it ships is
    # how a bad release reaches every fork before its author has heard.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Security fixes travel on their own so they are not held up behind a major version bump
      # somebody is arguing about.
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Versions that were tried and left, each for a reason found by running it (#214, #219,
    # 2026-10-13). An ignore stops the weekly proposal, never a security update. A line comes out
    # in the change that makes its version work.
    ignore:
      # Pinned exactly. 1.77 does not compile against the server's agent map, and what the app
      # still uses of it is being replaced with code of our own.
      - dependency-name: "@copilotkit/*"
      # 1.7 moves the OAuth client's exports and the shape of its authorisation parameters:
      # sign-in source changes, to be made with sign-in exercised, not as a version bump.
      - dependency-name: better-auth
        versions: [">= 1.7"]
      - dependency-name: "@better-auth/drizzle-adapter"
        versions: [">= 1.7"]
      # 1.32's client transports follow same-origin redirects themselves; the server refuses
      # every redirect and writes a row for it (server/src/plugins/mcp.ts).
      - dependency-name: "@modelcontextprotocol/sdk"
        versions: [">= 1.32"]
      # 0.6.8 rewrote how composition is handled — the path every Korean keystroke takes — and
      # 0.7 adds a peer package. Lands with a person typing Korean into it.
      - dependency-name: prompt-area
        versions: [">= 0.6.8"]
      # Under 20.14 the app's tests do not finish.
      - dependency-name: "@happy-dom/global-registrator"
        versions: [">= 20.14"]
      # Moves with the browser image, by hand, in one change (agent-computer/Dockerfile): the
      # image's browser directory is named after the build this package expects.
      - dependency-name: playwright
      # The transport between the server and the Bot's service: three packages pinned exactly at
      # one version, moved together with the protocol's tests (1.0 does not compile here).
      - dependency-name: "@ag-ui/*"
      # A compiler major is a change of its own: 7 does not typecheck this tree.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # One upgrade, not two, and the React Compiler rides on the plugin: checked in a browser.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # The base images. Every FROM is `name:tag@sha256:…` — the tag says what it is, the digest says
  # which bytes — and a digest is a thing nobody re-reads by hand: `caddy:2-alpine` would have sat
  # on 2.11.4 forever while the tag moved on without it. One entry per image directory; the deploy
  # bundle is `FROM scratch` and has nothing to pin.
  - package-ecosystem: docker
    directories:
      - /server
      - /app
      - /agent-bot
      - /agent-computer
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # The images run what the gate ran. Under Bun 1.4 two of the workbench's tests fail (#219):
      # 1.4.1 keeps a unix-socket connection alive, and the daemon's client must not go on
      # talking to a process that is gone. Comes out with the fix, and CI's Bun moves with it.
      - dependency-name: oven/bun
        versions: [">= 1.4"]
      # The computer's base is the release Playwright's own image is built on (noble), so the
      # browser meets the libraries it was built against. Moves when theirs does.
      - dependency-name: ubuntu
        versions: ["> 24.04"]
    commit-message:
      prefix: "build(deps)"

  # The shell's crates. `Cargo.lock` pins them and nothing else ever moves it; a Tauri patch that
  # fixes the updater or the webview reaches an installed app only through here.
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      shell:
        patterns: ["*"]
        update-types: [minor, patch]
    # THE ONE CRATE NO BUMP HERE CAN MOVE, WRITTEN DOWN INSTEAD OF RE-DISCOVERED BY A RED RUN.
    #
    # `glib` 0.18.5 carries GHSA-wrw7-89jp-8q8g (fixed in 0.20.0), and the security update Dependabot
    # runs for it has failed since the alert opened on 2026-09-10: `security_update_not_possible`,
    # "latest possible version … 0.18.5". Nothing in Cargo.toml names glib. Tauri 2.11.5 — the newest
    # release, 2026-09-13 — draws its Linux window with the GTK 3 bindings: tauri-runtime-wry 2.11.4 →
    # wry 0.55 and tao 0.35 → webkit2gtk =2.0.2 and gtk ^0.18 → glib ^0.18, and webkit2gtk 2.0.2 is
    # that crate's newest release. The newest wry (0.57) and tao (0.37) still ask for gtk ^0.18, so
    # bumping Tauri does not reach it either, and grouping the gtk-rs crates would move nothing:
    # version updates here touch direct dependencies only, and none of those crates is one.
    #
    # Only the versions that chain cannot reach are ignored, so a fix released on 0.18 would still be
    # proposed. This does not turn the run green: while the alert is open Dependabot still runs that
    # security update, and one whose fixes are all ignored fails as `all_versions_ignored`
    # (dependabot-core#9085) — pointing here rather than at nothing. Dismissing the alert is a
    # decision on GitHub, not a line in this file: glib is compiled for Linux and the BSDs only, and
    # the shell ships for macOS and Windows (release.yml). Take this out in the change that moves the
    # shell off gtk 0.18: `cargo tree -i glib --target all` in desktop/src-tauri says whether it has.
    # docs/laf/deploying.md ("The shell") records the advisory.
    ignore:
      - dependency-name: glib
        versions: [">= 0.19"]
    commit-message:
      prefix: "chore(deps)"

  # The workflows pin every action by commit SHA, which is the safe form and also the form nobody
  # can read for freshness. This is what re-pins them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    # A week between a release and a pull request about it: a package pulled the day it ships is
    # how a bad release reaches every fork before its author has heard.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
