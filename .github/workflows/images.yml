name: Images

# Builds the four deployment images and publishes them to GHCR, so a deployment PULLS instead of
# compiling. This is the half of unattended provisioning that lives in this repository: the external
# control plane (a separate repo) clones nothing heavy and builds nothing — it writes an .env,
# `docker compose pull`, `up -d`, and the VM never spends its one small OCPU on a 20-minute build.
#
# Channels, chosen by how the run started:
#   a `v*` tag      → :vX.Y.Z and :stable — a release moves the fleet's default channel
#   push to main    → :edge, so a rehearsal VM always runs what main is. Measured 2026-09-07: :edge
#                     was twelve days and two sign-in changes behind main, because nobody dispatched,
#                     and no image on GHCR could sign anybody in. Pushes that change only
#                     documentation skip the build (the filter below).
#   manual dispatch → :edge from the default branch; tick `promote_stable` to also move :stable,
#                     which exists so the very first :stable can be minted before any release tag
#
# NOTHING IS PUBLISHED UNTIL THE CHECKS PASS. Every build here waits on `checks`, which is the same
# `.github/workflows/checks.yml` that CI runs — one definition, called from two places, rather than
# a copy of the steps that drifts from the original. Before it, `:stable` moved on a tag with no
# `needs` at all: measured on v0.3.2, images finished at 05:50:53 while CI was still a separate run
# that a tag did not even start. Since 2026-09-10 this is the ONLY run of the checks on main and on
# tags — `ci.yml` covers pull requests and `laf/**` — so a commit is checked once, not twice.
#
# Both architectures are built on NATIVE runners — amd64 on `ubuntu-latest`, arm64 on
# `ubuntu-24.04-arm` — and merged into one manifest per image; QEMU emulation would turn the app
# build into a half-hour job. arm64 is not optional: customer VMs are Ampere A1. The repository went
# private on 2026-09-10 and stayed on that runner, because GitHub's runner reference lists
# `ubuntu-24.04-arm` under "Standard GitHub-hosted runners for private repositories" (2 vCPU / 8 GB
# there, against 4 / 16 GB for public ones) and says those runners "use your GitHub account's
# allotment of free minutes, and are then charged at the per minute rates" — $0.005 a minute for
# Linux arm64 against $0.006 for x64, so this is the cheapest leg here, not a premium one.
# Measured 2026-09-01..10 on the public 4-vCPU runner: the four arm64 builds took ≈5 minutes a run;
# the private runner has half the cores, so expect more. If the label is ever refused, the fallback
# is `docker/setup-qemu-action` on `ubuntu-latest` — unmeasured, and the reason the native runner
# was chosen in the first place.
#   https://docs.github.com/en/actions/reference/runners/github-hosted-runners
#   https://docs.github.com/en/billing/reference/actions-runner-pricing
# No build cache, same reason as release.yml: a workflow that publishes must not restore what a
# pull request could have written.
#
# The one value baked into an image that could differ per deployment is AUTH_PROVIDERS. Since
# 2026-09-06 it is only the web surface's FALLBACK: the sign-in screen asks the running server
# (`GET /api/auth/providers`) which buttons to draw and lands on the baked list only when the
# server cannot answer. The repository variable IMAGE_AUTH_PROVIDERS names that fallback; a
# deployment's real set is its own `.env`.

on:
  push:
    # Tags are never path-filtered: GitHub does not evaluate path filters for pushes of tags.
    tags: ["v*"]
    branches: [main]
    # Documentation only. Not `**/*.md`, which this used to be: `app/src/help/guide.md` and
    # `app/src/legal/*.md` are bundled into the web image, and a change to the privacy policy alone
    # published nothing. Same list as ci.yml.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/README.md"
      - ".github/pull_request_template.md"
  workflow_dispatch:
    inputs:
      promote_stable:
        description: "Also move :stable to this build"
        type: boolean
        default: false

# Nothing at the top: each job says what it needs. `checks` reads the tree; the two publishing jobs
# write packages, and only they do.
permissions: {}

# A burst of pushes to main publishes only the newest: the run for an older commit is cancelled when
# a newer one queues, which is what a private repository on the Free plan can afford (a run here is
# ≈13 Linux + 5 arm64 minutes, measured 2026-09-01..10). A cancelled run can leave a per-arch tag
# (`:edge-amd64`) ahead of the merged `:edge`, which is harmless: the manifest references digests,
# not tags, and the newer run rewrites both halves and merges again. A tag is never cancelled — it
# is its own group, and a release build must finish.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io/laf-labs

jobs:
  # The gate. Format, lint, types, the test floor and the app build, against the exact ref being
  # published — a tag reference resolves this file at that tag.
  checks:
    uses: $/.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    name: ${{ matrix.service }} (${{ matrix.arch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [server, web, agent-bot, agent-computer]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # The channel a per-arch tag belongs to. Merged tags are minted in the merge job.
      - name: Decide the channel
        id: channel
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "channel=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (per-arch)
        env:
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          # Names only, never credentials: a build arg is readable in the image history.
          AUTH_PROVIDERS: ${{ vars.IMAGE_AUTH_PROVIDERS || 'google' }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          case "$SERVICE" in
            server)         DOCKERFILE=server/Dockerfile ;;
            web)            DOCKERFILE=app/Dockerfile ;;
            agent-bot)      DOCKERFILE=agent-bot/Dockerfile ;;
            agent-computer) DOCKERFILE=agent-computer/Dockerfile ;;
          esac
          docker buildx build \
            --platform "linux/$ARCH" \
            --file "$DOCKERFILE" \
            --build-arg AUTH_PROVIDERS="$AUTH_PROVIDERS" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag "$REGISTRY/openbot-$SERVICE:$CHANNEL-$ARCH" \
            --push \
            .

  merge:
    name: manifest ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [server, web, agent-bot, agent-computer]
    steps:
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Merge the architectures into one tag
        env:
          SERVICE: ${{ matrix.service }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PROMOTE: ${{ github.event.inputs.promote_stable }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          IMAGE="$REGISTRY/openbot-$SERVICE"
          if [ "$REF_TYPE" = "tag" ]; then
            CHANNEL="$REF_NAME"
            EXTRA=(-t "$IMAGE:stable")
          else
            CHANNEL=edge
            EXTRA=()
            if [ "$PROMOTE" = "true" ]; then EXTRA=(-t "$IMAGE:stable"); fi
          fi
          docker buildx imagetools create \
            -t "$IMAGE:$CHANNEL" "${EXTRA[@]}" \
            "$IMAGE:$CHANNEL-amd64" "$IMAGE:$CHANNEL-arm64"
          docker buildx imagetools inspect "$IMAGE:$CHANNEL" | head -20
