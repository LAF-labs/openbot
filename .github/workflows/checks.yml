name: Checks

# The checks themselves, in one place, called by whatever needs them.
#
# It exists because the fleet's `:stable` tag used to move without them. `images.yml` publishes on a
# `v*` tag and had no `needs` on CI, and CI did not run on tags at all: measured on v0.3.2, the two
# workflows ran in parallel and a tag put untested code in front of every deployment two minutes
# after it was pushed. Copying the check steps into the publishing workflow would have fixed that
# and created the real problem — two definitions of "the gate", drifting apart the first time
# somebody edits one.
#
# So the jobs live here and both callers reference them, each on its own refs so that a commit is
# checked once: `ci.yml` runs them on pull requests and on `laf/**` pushes; `images.yml` runs them
# on main and on tags, as the prerequisite of the build that moves `:edge` and `:stable`. Called
# from a tag, the reference resolves at that tag, so what is checked is exactly what is about to be
# published. (Until 2026-09-10 `ci.yml` ran them on main and tags as well — the same commit twice,
# which the repository, private on the Free plan's 2,000 minutes from 2026-09-10 to 2026-09-16,
# could not afford; public again it could, and checking a commit once is still enough. See ci.yml.)

on:
  workflow_call:

# Least privilege by default. Nothing here writes anything.
permissions:
  contents: read

jobs:
  # Formatting, linting, typing and tests are independent checks, so each reports its own result.
  static:
    name: format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout leaves a usable credential in the runner otherwise, which every later step and
          # every action it calls can read. Nothing here pushes.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      # Covers agent-computer since it became a workspace: the service that drives a browser was
      # otherwise typechecked by nothing at all on its way into an image.
      - run: bun run typecheck

  test:
    name: tests
    runs-on: ubuntu-latest
    # The suite includes a real database integration test. Without a database it fails on every run,
    # including on main, which trains everyone to read a red CI as normal. Plain postgres: the image
    # was pgvector's for one `vector(1536)` column in a table nothing ever wrote to, and migration
    # 0024 drops the column, the table and the extension.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: openbot
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Not the db:migrate script: that one loads ../.env, which does not exist in CI. DATABASE_URL
      # comes from the job env instead, which drizzle.config.ts already reads.
      - run: bunx drizzle-kit migrate --config=drizzle.config.ts
        working-directory: server
      # A passing job must include the expected test floor. Import-time failures can otherwise skip
      # files before their tests are registered.
      # The browser suite (agent-computer/tests/korean-*.test.ts) skips itself when Playwright
      # has no Chromium; without this step CI would report those tests as passing by absence.
      - run: bunx playwright install --with-deps chromium
      # The Bot's browser runs with its sandbox ON (agent-computer/src/profiles.ts), and the sandbox is
      # unprivileged user namespaces, which Ubuntu 24.04 refuses to an unconfined process. The runner
      # starts the computer on the host, unconfined; a deployment starts it in a container under
      # `docker-default`, where the restriction does not apply. Measured 2026-09-13 on Ubuntu 24.04
      # aarch64: unconfined with the restriction on, Chromium exits "No usable sandbox!"; off, it
      # starts. Lifted on this throwaway runner only, so the suite drives the browser a VM runs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run test:ci

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
