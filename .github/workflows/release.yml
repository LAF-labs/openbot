name: Release

# Builds the desktop shell for every platform it ships on, signs the updater artifacts, and carries
# them to the fleet's front door, `https://agent.laf-co.com/desktop/` — where installed apps look for
# their next version and where a new customer downloads the app. Pushing a `v*` tag does the whole
# thing; a push to `main` and a manual run only build and keep the installers as workflow artifacts,
# so nobody can publish by clicking.
#
# WHY THE FRONT DOOR AND NOT A GITHUB RELEASE. This repository went private on 2026-09-10, and from
# that day `releases/latest/download/latest.json` — the endpoint every installed app was built with —
# answered 404 to anybody without an account: no app could update, and there was no public place to
# download one. The updater now reads `https://agent.laf-co.com/desktop/latest.json`
# (desktop/scripts/front-door.ts writes it; laf-control's `laf desktop door` built the door). The
# repository is public again since 2026-09-16, and the door stays: a visibility change must never
# again be able to stop every installed app from updating.
#
# AND NO DRAFT RELEASE BESIDE IT, on purpose. Publishing the draft used to be the gate that offered
# an update; nothing reads GitHub releases any more, so a draft would be a button that does nothing
# — with a latest.json inside pointing every app at URLs that answer 404. Dropping it is also what
# takes `contents: write` away from the build jobs, which hold the updater's signing key while they
# run other people's build code. The record of a release is its tag (the code) and the door (the
# bytes, newest three versions); a version the door no longer keeps is rebuilt from its tag.
#
# THE INSTALLERS EXIST ON EVERY PUSH THAT TOUCHES THE SHELL, and that is the point of the build-only
# path. Before it, getting a `.dmg` or a `.exe` into anybody's hands took a tag — which is a
# release, with a version, a draft and an update feed behind it — or a manual dispatch, which is a
# person with the right browser tab open. So for weeks the answer to "can I try the app?" was "not
# without cutting a release". A push to main that changes `desktop/**` (or this file) now leaves
# both installers as workflow artifacts (`darwin-universal-dmg`, `windows-x64-nsis`), downloadable
# from the run, for ninety days; a manual run does the same from any ref. Nothing on that path
# creates, extends or publishes a release: the action only touches a release when `tagName` is
# non-empty, and it is empty on everything but a tag. It also builds with the updater taken out —
# otherwise the installer replaces itself with the last published release the first time somebody
# opens it, which was measured, not feared.
#
# WHY NOT EVERY PUSH TO MAIN: this is the most expensive run in the repository, and from 2026-09-10
# to 2026-09-16 the repository was private on GitHub's Free plan — 2,000 included minutes a month,
# with macOS counted at ten times and Windows at twice the Linux rate. Public again, the minutes are
# free; the trigger stays, because a shell that changes a few times a month needs no build per push. Measured 2026-09-01..10: the macOS leg
# takes 10–13 minutes and the Windows leg 13–16, so one run is ≈130–160 weighted minutes, 7% of a
# month, for a shell that is a window onto the origin and changes a few times a month, on a main
# that moves several times a day. The shell's version and config (`tauri.conf.json`, `Cargo.toml`,
# `Cargo.lock`, `package.json`) all live under `desktop/`, so `desktop/**` is the whole trigger;
# everything else on main ships through the origin, which the installed app loads at launch. The
# numbers are in docs/laf/deploying.md, "저장소 공개 여부와 CI 비용".
#
# The shell is a window onto the deployed origin (see desktop/README.md): there is no frontend to
# build here and nothing native beyond Tauri itself, which is why a universal macOS binary is cheap
# and why the whole job is the Rust compile.
#
# Secrets, all entered by a person in the repository settings:
#   TAURI_SIGNING_PRIVATE_KEY          required. The file `tauri signer generate` wrote — the
#                                      base64 blob, not the decoded two-line minisign text. It is the
#                                      private half of plugins.updater.pubkey in tauri.conf.json; the
#                                      installed app refuses a manifest signed by anything else.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password, or an empty secret if it has none.
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#                                      optional, all six together: Developer ID signing and
#                                      notarization. Without them the dmg is ad-hoc signed and
#                                      Gatekeeper warns on every other Mac — a rehearsal, not a ship.
#
# And set by `bun run laf desktop door` in laf-control, never by hand (`--rotate` replaces them):
#   DESKTOP_DOOR_SSH_KEY               the private half of the one key the entry VM accepts for
#                                      `laf-desktop`, whose authorized_keys line is
#                                      `restrict,command="/usr/local/lib/laf-desktop/receive"`: it
#                                      can hand a tar to the receiver and do nothing else.
#   DESKTOP_DOOR_KNOWN_HOSTS           the entry VM's host key, pinned from the operator's session.
#   DESKTOP_DOOR_KEY_FINGERPRINT       a VARIABLE, not a secret: the public fingerprint the verb
#                                      wrote last, after everything else it did succeeded.
#
# A pull request that touches `desktop/**` runs the `shell` job and nothing else: no secrets, no
# write permission, no bundle. It is here rather than in `ci.yml` because CI runs on Linux, where
# Tauri needs webkit2gtk development packages for a binary that only ever ships as a .app and an
# .exe — so the shell's Rust tests can only run on the runners it is actually built on.
#
# THE TAG IS THE GATE NOW. The door job runs once both platforms built and signed (`needs: build`
# with `fail-fast: false` still lets one platform finish while the other fails, but a red leg means
# no door job at all), and the moment it succeeds every installed app is offered the version on its
# next launch. So a tag is a release, not a rehearsal: rehearse on a `main` push's installers.

on:
  push:
    # The tag path is not filtered: GitHub does not evaluate path filters for pushes of tags, so a
    # release builds whatever the tag holds.
    tags: ["v*"]
    # The build-only path. A push to main that touches the shell produces both installers and no
    # release. The shell's README is documentation; the workflow file is in the list because a
    # change to how the shell is built is only proven by building it.
    branches: [main]
    paths:
      - "desktop/**"
      - "!desktop/README.md"
      # The publisher runs on a tag only and is not in either installer; a change to it alone is
      # proven by tests/desktop-front-door.test.ts, not by ~150 weighted minutes of compile.
      - "!desktop/scripts/**"
      - ".github/workflows/release.yml"
  # And on a pull request that touches the shell, for the `shell` job below only. `ci.yml` runs on
  # Linux, where this crate does not build at all, so before this the shell's own tests ran nowhere
  # until somebody pushed a tag — which is the last moment anybody wants to learn about them.
  pull_request:
    paths: ["desktop/**", "!desktop/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

# The newest push wins on a branch or a pull request: a burst of shell commits builds once, at the
# end, instead of once per commit at macOS prices. A tag is never cancelled — its run IS the release,
# and a release that stopped after the macOS build has spent the minutes and shipped nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # The shell's decisions, on the pull request that changes them. macOS is the cheapest runner that
  # can build this crate at all, the path filter above means most pull requests never reach here,
  # and this job holds no secrets and writes nothing — the release build below is a separate job
  # that a pull request does not run.
  shell:
    name: shell tests
    runs-on: macos-14
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `actions-rust-lang`, not `dtolnay/rust-toolchain`: dtolnay force-pushes its `stable` branch, so
      # a commit pinned there stops belonging to any branch and zizmor's impostor-commit audit
      # failed every run from 2026-08-05 on. A tag on this action keeps its history.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - name: Test the shell
        working-directory: desktop/src-tauri
        run: cargo test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Never on a pull request: this job holds the updater's signing key. The trigger above exists for
    # `shell` alone.
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    # Read-only. It runs a compile full of other people's code while holding the signing key, and
    # since the draft release went (see the top of this file) nothing here writes to the repository.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal dmg)
            runner: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            door: macos
          - name: Windows (x64 installer)
            runner: windows-latest
            targets: ""
            args: ""
            door: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          # Same reason as the missing Rust cache below: nothing a pull request wrote may be
          # restored into a run that publishes.
          no-cache: true

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.targets }}
          cache: false

      # No build cache on purpose: a workflow that publishes must not restore from a cache that a
      # pull request could have written (zizmor's cache-poisoning audit). The compile is minutes.
      - run: bun install --frozen-lockfile

      # The shell's own decisions, checked before a release is built out of them. Here rather than in
      # CI because CI runs on Linux, where this crate cannot build without a pile of system webkit
      # packages it will never ship against; these runners are the platforms it actually ships on.
      - name: Test the shell
        working-directory: desktop/src-tauri
        run: cargo test

      # THE UPDATER BELONGS TO A RELEASE, AND A BUILD-ONLY RUN IS NOT ONE. Two things go wrong
      # without this, and the second was measured on a real bundle:
      #
      #   1. `createUpdaterArtifacts` is on in `tauri.conf.json`, and the bundler REFUSES TO BUILD
      #      with it on and no signing key in the environment. A build-only run that has no key
      #      would produce nothing at all instead of the installers it exists for.
      #   2. The endpoint is the front door's latest.json, and the version in the file is whatever
      #      main happens to carry — 0.2.0, while the last release was 0.4.4. So a build-only
      #      installer launched, found a "newer" version, and REPLACED ITSELF WITH THE RELEASE: the
      #      log read `update 0.4.4 is available; installing` (measured against the GitHub endpoint
      #      this one replaced), and the commit somebody installed the build to try was gone on the
      #      next launch. Emptying the endpoints makes the plugin inert (`no updater configured:
      #      Updater does not have any endpoints set.`) and the app runs unchanged.
      #
      # Both are stamped on the runner, like the version below, and neither is committed: the file
      # in the repository keeps the updater on, for the tag path, which is the only path that has a
      # release to update anybody to.
      - name: Take the updater out of a build that is not a release
        if: github.ref_type != 'tag'
        shell: bash
        working-directory: desktop
        run: |
          bun -e 'const p = "src-tauri/tauri.conf.json"; const c = await Bun.file(p).json(); c.bundle.createUpdaterArtifacts = false; c.plugins.updater.endpoints = []; await Bun.write(p, JSON.stringify(c, null, 2))'
          echo "This build makes no updater artifacts and checks for no updates."

      # Sign a throwaway file before spending the build on it. A mangled secret — the decoded text
      # pasted instead of the file, a stray carriage return — fails here in seconds with the same
      # decode path the bundler uses, instead of as a cryptic error after the compile.
      #
      # A TAG WITHOUT THE KEY STILL FAILS HERE, and should: a release whose `latest.json` is
      # unsigned is one no installed app will accept, and the moment to learn that is before the
      # compile, not at the door. A build-only run skips the step entirely — it signs nothing, so a
      # missing key costs it nothing.
      - name: Prove the updater key can sign
        if: github.ref_type == 'tag'
        shell: bash
        # Run in the desktop workspace, which is where the Tauri CLI is installed. From the
        # repository root `bunx tauri` finds nothing local and fetches an unrelated package of that
        # name from npm — while this step holds the signing key in its environment.
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. The updater cannot sign, and the installed app refuses unsigned manifests."
            exit 1
          fi
          echo probe > sign-probe.txt
          bunx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" sign-probe.txt
          rm -f sign-probe.txt sign-probe.txt.sig

      # The same question about the door, asked before ~150 weighted minutes are spent on a release
      # that has nowhere to go. The variable, not the key: this job never holds the door's key, and
      # the fingerprint is written only after `laf desktop door` finished everything else.
      - name: Prove the front door is keyed
        if: github.ref_type == 'tag'
        shell: bash
        env:
          DOOR_FINGERPRINT: ${{ vars.DESKTOP_DOOR_KEY_FINGERPRINT }}
        run: |
          if [ -z "$DOOR_FINGERPRINT" ]; then
            echo "::error::DESKTOP_DOOR_KEY_FINGERPRINT is not set: the front door was never keyed. Run 'bun run laf desktop door' in laf-control, then push the tag again."
            exit 1
          fi
          echo "The door is keyed ($DOOR_FINGERPRINT)."

      # The built version comes from tauri.conf.json, which does not know what tag it is being built
      # for. Without this every release carries the version in the file — 0.1.0 forever — and an
      # installed app compares that against its own, finds them equal, and is never offered the
      # update. The tag is the version and the file follows it. Not committed: it is stamped on the
      # runner, for this build.
      - name: Stamp the version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        # X.Y.Z exactly: the door orders versions as three numbers and refuses anything else, so a
        # `v1.2.3-rc.1` is refused here, before the compile, rather than after it.
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a version. Tag releases as v1.2.3."
            exit 1
          fi
          export VERSION
          bun -e 'const p = "src-tauri/tauri.conf.json"; const c = await Bun.file(p).json(); c.version = process.env.VERSION; await Bun.write(p, JSON.stringify(c, null, 2))'
          echo "Building version $VERSION"
        working-directory: desktop

      # Apple signing is optional until a Developer ID exists. The variables are exported only when
      # the secret is present: the bundler treats an EMPTY APPLE_CERTIFICATE as a certificate to
      # import, and fails on it. Half-configured is refused rather than attempted, because
      # notarization with empty credentials fails deep in the bundler with an unrelated message.
      - name: Export Apple signing when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NAMES="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple signing secrets: the dmg will be ad-hoc signed (rehearsal only)."
            exit 0
          fi
          missing=""
          for name in $NAMES; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Apple signing is only partly configured. Missing:$missing"
            exit 1
          fi
          # Heredoc form rather than NAME=value: a certificate is base64 that GitHub may store with
          # newlines, and a bare assignment would both truncate it and let a newline inside any
          # secret define environment variables of its own.
          for name in $NAMES; do
            {
              echo "$name<<__LAF_SECRET__"
              printf '%s\n' "${!name}"
              echo "__LAF_SECRET__"
            } >> "$GITHUB_ENV"
          done
          echo "Developer ID signing and notarization are on."


      # Build — and on a tag, sign the updater artifacts (the bundler does, from the key in the
      # environment). No `tagName`, ever: without one the action reaches nothing release-shaped. On a
      # push to main or a manual run it keeps the installers as workflow artifacts, named
      # `[platform]-[arch]-[bundle]`, one file each: `darwin-universal-dmg` here and
      # `windows-x64-nsis` (the `-setup.exe`) on the other runner.
      - name: Build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}

      # On a tag, what the door serves goes to the door job and nowhere else: this platform's
      # installer and its updater files, where the bundler wrote them. One list for both runners;
      # each matches its own half, and the door job refuses a release missing either.
      - name: Hand the signed files to the door job
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: door-${{ matrix.door }}
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*_universal.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The release itself: both platforms' signed files, checked against the key the app embeds, onto
  # https://agent.laf-co.com/desktop/<version>/ and read back from outside. The only job that holds
  # the door's key, and it runs no build: checkout, bun, and one script with no dependencies.
  door:
    name: front door
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: door-*
          path: door-in

      # The key is checked against the fingerprint `laf desktop door` wrote last before it is used:
      # a secret replaced by hand, or a rotation that died half-way, is named here instead of
      # arriving as `Permission denied (publickey)`. Then the script stages the version (refusing a
      # signature any installed app would refuse), sends it as a tar to the forced command — which
      # places it, moves `current` onto it and keeps three — and reads it back over HTTPS.
      - name: Carry the release to the front door
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DOOR_KEY: ${{ secrets.DESKTOP_DOOR_SSH_KEY }}
          DOOR_KNOWN_HOSTS: ${{ secrets.DESKTOP_DOOR_KNOWN_HOSTS }}
          DOOR_FINGERPRINT: ${{ vars.DESKTOP_DOOR_KEY_FINGERPRINT }}
        run: |
          if [ -z "$DOOR_KEY" ] || [ -z "$DOOR_KNOWN_HOSTS" ] || [ -z "$DOOR_FINGERPRINT" ]; then
            echo "::error::The front door is not keyed. Run 'bun run laf desktop door' in laf-control; it sets DESKTOP_DOOR_SSH_KEY, DESKTOP_DOOR_KNOWN_HOSTS and DESKTOP_DOOR_KEY_FINGERPRINT."
            exit 1
          fi
          umask 077
          door="$RUNNER_TEMP/door"
          mkdir -p "$door"
          printf '%s\n' "$DOOR_KEY" > "$door/key"
          printf '%s\n' "$DOOR_KNOWN_HOSTS" > "$door/known_hosts"
          held=$(ssh-keygen -lf "$door/key" | awk '{print $2}')
          if [ "$held" != "$DOOR_FINGERPRINT" ]; then
            echo "::error::DESKTOP_DOOR_SSH_KEY is $held, and the door was last keyed with $DOOR_FINGERPRINT. Run 'bun run laf desktop door --rotate' in laf-control."
            exit 1
          fi
          bun desktop/scripts/front-door.ts \
            --from door-in \
            --version "${TAG#v}" \
            --stage "$RUNNER_TEMP/door-stage" \
            --key "$door/key" \
            --known-hosts "$door/known_hosts"
