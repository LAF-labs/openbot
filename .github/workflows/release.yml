name: Release

# Builds the desktop shell for every platform it ships on, signs the updater artifacts, and
# publishes them as a DRAFT release. Pushing a `v*` tag does the whole thing; a manual run only
# builds and keeps the installers as workflow artifacts, so nobody can publish by clicking.
#
# The shell is a window onto the deployed origin (see desktop/README.md): there is no frontend to
# build here and nothing native beyond Tauri itself, which is why a universal macOS binary is cheap
# and why the whole job is the Rust compile.
#
# Secrets, all entered by a person in the repository settings:
#   TAURI_SIGNING_PRIVATE_KEY          required. The file `tauri signer generate` wrote — the
#                                      base64 blob, not the decoded two-line minisign text. It is the
#                                      private half of plugins.updater.pubkey in tauri.conf.json; the
#                                      installed app refuses a manifest signed by anything else.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password, or an empty secret if it has none.
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#                                      optional, all six together: Developer ID signing and
#                                      notarization. Without them the dmg is ad-hoc signed and
#                                      Gatekeeper warns on every other Mac — a rehearsal, not a ship.
#
# `releases/latest/download/latest.json` — the updater endpoint — only serves PUBLISHED releases,
# so no installed app is offered anything until the draft is published. That is the gate.
#
# Both platform jobs write into the SAME draft and the action merges their platforms into one
# latest.json. They deliberately do not fail as a unit (`fail-fast: false`, so one platform failing
# does not cancel the other's build), which means a RED run can still leave a draft holding one
# platform. Read the run before publishing the draft: green is both, red is not.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Creating the draft release and uploading to it is the one thing here that writes.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal dmg)
            runner: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows (x64 installer)
            runner: windows-latest
            targets: ""
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          # Same reason as the missing Rust cache below: nothing a pull request wrote may be
          # restored into a run that publishes.
          no-cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          targets: ${{ matrix.targets }}

      # No build cache on purpose: a workflow that publishes must not restore from a cache that a
      # pull request could have written (zizmor's cache-poisoning audit). The compile is minutes.
      - run: bun install --frozen-lockfile

      # Sign a throwaway file before spending the build on it. A mangled secret — the decoded text
      # pasted instead of the file, a stray carriage return — fails here in seconds with the same
      # decode path the bundler uses, instead of as a cryptic error after the compile.
      - name: Prove the updater key can sign
        shell: bash
        # Run in the desktop workspace, which is where the Tauri CLI is installed. From the
        # repository root `bunx tauri` finds nothing local and fetches an unrelated package of that
        # name from npm — while this step holds the signing key in its environment.
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. The updater cannot sign, and the installed app refuses unsigned manifests."
            exit 1
          fi
          echo probe > sign-probe.txt
          bunx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" sign-probe.txt
          rm -f sign-probe.txt sign-probe.txt.sig

      # The built version comes from tauri.conf.json, which does not know what tag it is being built
      # for. Without this every release carries the version in the file — 0.1.0 forever — and an
      # installed app compares that against its own, finds them equal, and is never offered the
      # update. The tag is the version and the file follows it. Not committed: it is stamped on the
      # runner, for this build.
      - name: Stamp the version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' is not a version. Tag releases as v1.2.3."; exit 1 ;;
          esac
          export VERSION
          bun -e 'const p = "src-tauri/tauri.conf.json"; const c = await Bun.file(p).json(); c.version = process.env.VERSION; await Bun.write(p, JSON.stringify(c, null, 2))'
          echo "Building version $VERSION"
        working-directory: desktop

      # Apple signing is optional until a Developer ID exists. The variables are exported only when
      # the secret is present: the bundler treats an EMPTY APPLE_CERTIFICATE as a certificate to
      # import, and fails on it. Half-configured is refused rather than attempted, because
      # notarization with empty credentials fails deep in the bundler with an unrelated message.
      - name: Export Apple signing when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NAMES="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple signing secrets: the dmg will be ad-hoc signed (rehearsal only)."
            exit 0
          fi
          missing=""
          for name in $NAMES; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Apple signing is only partly configured. Missing:$missing"
            exit 1
          fi
          # Heredoc form rather than NAME=value: a certificate is base64 that GitHub may store with
          # newlines, and a bare assignment would both truncate it and let a newline inside any
          # secret define environment variables of its own.
          for name in $NAMES; do
            {
              echo "$name<<__LAF_SECRET__"
              printf '%s\n' "${!name}"
              echo "__LAF_SECRET__"
            } >> "$GITHUB_ENV"
          done
          echo "Developer ID signing and notarization are on."


      # On a tag: build, sign the updater artifacts, create or extend the draft release. Both matrix
      # jobs land in the same draft, and the action merges their platforms into one latest.json.
      # On a manual run: build only, and keep the installers as workflow artifacts.
      - name: Build and publish draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('LAF Agent {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
