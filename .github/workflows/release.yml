name: Release

# Builds the desktop shell for every platform it ships on, signs the updater artifacts, and
# publishes them as a DRAFT release. Pushing a `v*` tag does the whole thing; a push to `main` and a
# manual run only build and keep the installers as workflow artifacts, so nobody can publish by
# clicking.
#
# THE INSTALLERS EXIST ON EVERY PUSH TO MAIN, and that is the point of the build-only path. Before
# it, getting a `.dmg` or a `.exe` into anybody's hands took a tag — which is a release, with a
# version, a draft and an update feed behind it — or a manual dispatch, which is a person with the
# right browser tab open. So for weeks the answer to "can I try the app?" was "not without cutting a
# release". A push to main now leaves both installers as workflow artifacts (`darwin-universal-dmg`,
# `windows-x64-nsis`), downloadable from the run, for ninety days. Docs-only pushes skip it, the same
# filter `images.yml` uses. Nothing on that path creates, extends or publishes a release: the action
# only touches a release when `tagName` is non-empty, and it is empty on everything but a tag. It
# also builds with the updater taken out — otherwise the installer replaces itself with the last
# published release the first time somebody opens it, which was measured, not feared.
#
# The shell is a window onto the deployed origin (see desktop/README.md): there is no frontend to
# build here and nothing native beyond Tauri itself, which is why a universal macOS binary is cheap
# and why the whole job is the Rust compile.
#
# Secrets, all entered by a person in the repository settings:
#   TAURI_SIGNING_PRIVATE_KEY          required. The file `tauri signer generate` wrote — the
#                                      base64 blob, not the decoded two-line minisign text. It is the
#                                      private half of plugins.updater.pubkey in tauri.conf.json; the
#                                      installed app refuses a manifest signed by anything else.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password, or an empty secret if it has none.
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#                                      optional, all six together: Developer ID signing and
#                                      notarization. Without them the dmg is ad-hoc signed and
#                                      Gatekeeper warns on every other Mac — a rehearsal, not a ship.
#
# A pull request that touches `desktop/**` runs the `shell` job and nothing else: no secrets, no
# write permission, no bundle. It is here rather than in `ci.yml` because CI runs on Linux, where
# Tauri needs webkit2gtk development packages for a binary that only ever ships as a .app and an
# .exe — so the shell's Rust tests can only run on the runners it is actually built on.
#
# `releases/latest/download/latest.json` — the updater endpoint — only serves PUBLISHED releases,
# so no installed app is offered anything until the draft is published. That is the gate.
#
# Both platform jobs write into the SAME draft and the action merges their platforms into one
# latest.json. They deliberately do not fail as a unit (`fail-fast: false`, so one platform failing
# does not cancel the other's build), which means a RED run can still leave a draft holding one
# platform. Read the run before publishing the draft: green is both, red is not.

on:
  push:
    tags: ["v*"]
    # The build-only path. A push to main produces both installers and no release.
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  # And on a pull request that touches the shell, for the `shell` job below only. `ci.yml` runs on
  # Linux, where this crate does not build at all, so before this the shell's own tests ran nowhere
  # until somebody pushed a tag — which is the last moment anybody wants to learn about them.
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The shell's decisions, on the pull request that changes them. macOS is the cheapest runner that
  # can build this crate at all, the path filter above means most pull requests never reach here,
  # and this job holds no secrets and writes nothing — the release build below is a separate job
  # that a pull request does not run.
  shell:
    name: shell tests
    runs-on: macos-14
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `actions-rust-lang`, not `dtolnay/rust-toolchain`: dtolnay force-pushes its `stable` branch, so
      # a commit pinned there stops belonging to any branch and zizmor's impostor-commit audit
      # failed every run from 2026-08-05 on. A tag on this action keeps its history.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - name: Test the shell
        working-directory: desktop/src-tauri
        run: cargo test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Never on a pull request: this job writes releases and holds the signing key. The trigger above
    # exists for `shell` alone.
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    # Creating the draft release and uploading to it is the one thing here that writes.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal dmg)
            runner: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows (x64 installer)
            runner: windows-latest
            targets: ""
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          # Same reason as the missing Rust cache below: nothing a pull request wrote may be
          # restored into a run that publishes.
          no-cache: true

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.targets }}
          cache: false

      # No build cache on purpose: a workflow that publishes must not restore from a cache that a
      # pull request could have written (zizmor's cache-poisoning audit). The compile is minutes.
      - run: bun install --frozen-lockfile

      # The shell's own decisions, checked before a release is built out of them. Here rather than in
      # CI because CI runs on Linux, where this crate cannot build without a pile of system webkit
      # packages it will never ship against; these runners are the platforms it actually ships on.
      - name: Test the shell
        working-directory: desktop/src-tauri
        run: cargo test

      # THE UPDATER BELONGS TO A RELEASE, AND A BUILD-ONLY RUN IS NOT ONE. Two things go wrong
      # without this, and the second was measured on a real bundle:
      #
      #   1. `createUpdaterArtifacts` is on in `tauri.conf.json`, and the bundler REFUSES TO BUILD
      #      with it on and no signing key in the environment. A build-only run that has no key
      #      would produce nothing at all instead of the installers it exists for.
      #   2. The endpoint is `releases/latest/download/latest.json`, and the version in the file is
      #      whatever main happens to carry — 0.2.0, while the last published release is 0.4.4. So a
      #      build-only installer launched, found a "newer" version, and REPLACED ITSELF WITH THE
      #      RELEASE: the log read `update 0.4.4 is available; installing`, and the commit somebody
      #      installed the build to try was gone on the next launch. Emptying the endpoints makes
      #      the plugin inert (`no updater configured: Updater does not have any endpoints set.`)
      #      and the app runs unchanged.
      #
      # Both are stamped on the runner, like the version below, and neither is committed: the file
      # in the repository keeps the updater on, for the tag path, which is the only path that has a
      # release to update anybody to.
      - name: Take the updater out of a build that is not a release
        if: github.ref_type != 'tag'
        shell: bash
        working-directory: desktop
        run: |
          bun -e 'const p = "src-tauri/tauri.conf.json"; const c = await Bun.file(p).json(); c.bundle.createUpdaterArtifacts = false; c.plugins.updater.endpoints = []; await Bun.write(p, JSON.stringify(c, null, 2))'
          echo "This build makes no updater artifacts and checks for no updates."

      # Sign a throwaway file before spending the build on it. A mangled secret — the decoded text
      # pasted instead of the file, a stray carriage return — fails here in seconds with the same
      # decode path the bundler uses, instead of as a cryptic error after the compile.
      #
      # A TAG WITHOUT THE KEY STILL FAILS HERE, and should: a release whose `latest.json` is
      # unsigned is one no installed app will accept, and the moment to learn that is not after the
      # draft is published. A build-only run skips the step entirely — it signs nothing, so a
      # missing key costs it nothing.
      - name: Prove the updater key can sign
        if: github.ref_type == 'tag'
        shell: bash
        # Run in the desktop workspace, which is where the Tauri CLI is installed. From the
        # repository root `bunx tauri` finds nothing local and fetches an unrelated package of that
        # name from npm — while this step holds the signing key in its environment.
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. The updater cannot sign, and the installed app refuses unsigned manifests."
            exit 1
          fi
          echo probe > sign-probe.txt
          bunx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" sign-probe.txt
          rm -f sign-probe.txt sign-probe.txt.sig

      # The built version comes from tauri.conf.json, which does not know what tag it is being built
      # for. Without this every release carries the version in the file — 0.1.0 forever — and an
      # installed app compares that against its own, finds them equal, and is never offered the
      # update. The tag is the version and the file follows it. Not committed: it is stamped on the
      # runner, for this build.
      - name: Stamp the version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' is not a version. Tag releases as v1.2.3."; exit 1 ;;
          esac
          export VERSION
          bun -e 'const p = "src-tauri/tauri.conf.json"; const c = await Bun.file(p).json(); c.version = process.env.VERSION; await Bun.write(p, JSON.stringify(c, null, 2))'
          echo "Building version $VERSION"
        working-directory: desktop

      # Apple signing is optional until a Developer ID exists. The variables are exported only when
      # the secret is present: the bundler treats an EMPTY APPLE_CERTIFICATE as a certificate to
      # import, and fails on it. Half-configured is refused rather than attempted, because
      # notarization with empty credentials fails deep in the bundler with an unrelated message.
      - name: Export Apple signing when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NAMES="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple signing secrets: the dmg will be ad-hoc signed (rehearsal only)."
            exit 0
          fi
          missing=""
          for name in $NAMES; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Apple signing is only partly configured. Missing:$missing"
            exit 1
          fi
          # Heredoc form rather than NAME=value: a certificate is base64 that GitHub may store with
          # newlines, and a bare assignment would both truncate it and let a newline inside any
          # secret define environment variables of its own.
          for name in $NAMES; do
            {
              echo "$name<<__LAF_SECRET__"
              printf '%s\n' "${!name}"
              echo "__LAF_SECRET__"
            } >> "$GITHUB_ENV"
          done
          echo "Developer ID signing and notarization are on."


      # On a tag: build, sign the updater artifacts, create or extend the draft release. Both matrix
      # jobs land in the same draft, and the action merges their platforms into one latest.json.
      # On a push to main or a manual run: build only, and keep the installers as workflow
      # artifacts. `tagName` is empty on those, and the action reaches nothing release-shaped
      # without one — no create, no extend, no publish, no latest.json. The artifacts are named
      # `[platform]-[arch]-[bundle]`, one file each: `darwin-universal-dmg` here and
      # `windows-x64-nsis` (the `-setup.exe`) on the other runner.
      - name: Build and publish draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('LAF Agent {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
