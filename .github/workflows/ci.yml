name: CI

on:
  pull_request:
  push:
    # laf/** because development lands on long-lived laf branches by direct push, not by pull
    # request. Without it those pushes run nothing at all, and every guarantee below — the test
    # floor, the fresh-database run, the typecheck — is only as good as the last time somebody
    # happened to open a PR.
    branches: [main, "laf/**"]
    # And tags, because a `v*` tag is what puts code in front of the whole fleet. Until this line
    # existed the one ref nobody checked was the only ref that shipped.
    tags: ["v*"]

# Least privilege by default. Jobs that need more must declare it locally.
permissions:
  contents: read

# The newest push on a branch wins; main runs are retained for badge and release history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The checks live in checks.yml so that this workflow and the one that publishes images run the
  # same definition rather than two copies of it. See that file.
  checks:
    uses: ./.github/workflows/checks.yml
