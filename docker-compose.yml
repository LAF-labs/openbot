services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # A person's VM reboots; their Bots are supposed to still be there when it does.
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["bun", "x", "drizzle-kit", "migrate", "--config=drizzle.config.ts"]
    environment:
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The API. Deliberately unpublished: the only way in is the web service's proxy, so a deployment
  # opens exactly one pair of ports however many services it runs.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # Arms two refusals that are otherwise only warnings: the public example encryption key, and
      # OPENBOT_DEV_NO_AUTH. Both are survivable mistakes locally and neither is survivable here,
      # so a deployment says which one it is rather than hoping nobody copied a development .env.
      NODE_ENV: production
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      TENANT_PACKAGE_DIR: ${TENANT_PACKAGE_DIR:-../tenant/laf}
      # Every Bot a person creates is answered here. Only package-shipped Bots are built in.
      MANAGED_AGENT_AG_UI_URL: http://agent-bot:4200/ag-ui
      # The Bot's browser. Absent, the failure waits until somebody presses hand-over.
      AGENT_COMPUTER_URL: http://agent-computer:4100
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      # Sign-in issues cookies for this exact string, scheme included: to a browser https://host
      # and host are different origins, and the mismatch reads as a session that never sticks.
      #
      # Both appear only when a provider is declared, because the API treats a partial auth
      # configuration as more dangerous than none — somebody meant to configure it and got it
      # wrong. Passing the origin unconditionally is how this file first refused to start a
      # deployment that had simply not set up OAuth yet, with an error naming the wrong value.
      BETTER_AUTH_URL: ${AUTH_PROVIDERS:+${PUBLIC_ORIGIN}}
      BETTER_AUTH_SECRET: ${AUTH_PROVIDERS:+${BETTER_AUTH_SECRET}}
      TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      # Which sign-ins this deployment offers — there is no email-and-password path, so without at
      # least one nobody can get in at all. AUTH_PROVIDERS declares the set (e.g. "google,kakao"),
      # the same value the web build compiles the buttons from, and the server refuses to start if
      # the declaration and the credentials disagree. Redirect URI per provider: the origin plus
      # /api/auth/callback/<provider>.
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID:-}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET:-}
      NAVER_OAUTH_CLIENT_ID: ${NAVER_OAUTH_CLIENT_ID:-}
      NAVER_OAUTH_CLIENT_SECRET: ${NAVER_OAUTH_CLIENT_SECRET:-}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      SIGN_IN_ALLOWED_EMAILS: ${SIGN_IN_ALLOWED_EMAILS:-}
      INTELLIGENCE_API_URL: ${INTELLIGENCE_API_URL:-}
      INTELLIGENCE_GATEWAY_WS_URL: ${INTELLIGENCE_GATEWAY_WS_URL:-}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      COPILOTKIT_LICENSE_TOKEN: ${COPILOTKIT_LICENSE_TOKEN:-}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      BOT_MODEL: ${BOT_MODEL:-}
      AGENT_STALL_TIMEOUT_MS: ${AGENT_STALL_TIMEOUT_MS:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent-bot:
        condition: service_healthy
      agent-computer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:3001/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The only service with published ports: TLS, the built app, and the proxy to the API.
  #
  # It starts as soon as the API's container exists rather than waiting for it to be healthy. A
  # front door that refuses to open while the kitchen warms up is worse than one that answers 502
  # — and the certificate cannot be issued at all until this is listening on 80.
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        # Which sign-in buttons exist is compiled into the app, so it is a build input and not a
        # setting. The same declaration the server validates against its credentials: change the
        # set and rebuild, or the two halves disagree.
        AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy's site address and the API's cookie origin are the same value, so they cannot drift.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # The www name only ever redirects to the apex. The default is at this layer, not just in
      # the Caddyfile, so an empty value from a bare `.env` line cannot become an empty site block.
      PUBLIC_WWW_ORIGIN: ${PUBLIC_WWW_ORIGIN:-http://www.localhost}
    volumes:
      # Certificates and the ACME account. Without this volume a restart re-requests the same
      # certificate, and five of those in a week is a Let's Encrypt rate limit measured in days.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  # The Bot's computer is long-lived so browser sessions remain signed in across turns.
  agent-computer:
    build:
      context: .
      dockerfile: agent-computer/Dockerfile
    image: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
    ports:
      # Loopback only. This process drives a browser holding real logins; COMPUTER_TOKEN is the
      # request control, and loopback keeps the surface off routed networks.
      - "127.0.0.1:${COMPUTER_PORT:-4100}:4100"
    environment:
      # The secret every caller must present. The container refuses to start without it.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
    volumes:
      - agent-workspace:/workspace
      # Chromium's user-data directory is volume-backed so logins survive container restarts.
      - agent-profiles:/profiles
    # Gives Chromium time to flush its profile after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    # A person's VM reboots; their Bots are supposed to still be there when it does.
    restart: unless-stopped

  # The built-in Bot is an AG-UI endpoint registered the same way as a customer-provided Bot.
  agent-bot:
    build:
      context: .
      dockerfile: agent-bot/Dockerfile
    ports:
      - "${BOT_PORT:-4200}:4200"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Unset means OpenAI. Set, it is any endpoint speaking the same API, and BOT_MODEL is sent
      # to it verbatim.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      BOT_MODEL: ${BOT_MODEL:-gpt-5.5}
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4200/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    # A person's VM reboots; their Bots are supposed to still be there when it does.
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  agent-workspace:
  agent-profiles:
