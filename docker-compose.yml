# Every service's logs, bounded.
#
# Docker's default json-file driver has no limit at all: a deployment that runs for months writes
# until the disk is full, and a full disk on a one-VM-per-person deployment stops Postgres, which
# stops everything. 10MB × 5 is a couple of days of a busy Bot and 50MB per service at worst.
#
# An anchor rather than five copies, so the next service added either inherits the bound or visibly
# does not. `tests/compose.test.ts` walks every service for it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Every service's memory, bounded — for the recommended VM, 1 OCPU / 6GB with a 4GB swapfile.
#
# Until 2026-09-10 the browser was the only service with a ceiling, and that protected Postgres
# from Chromium and from nothing else. The API server reads a whole conversation per turn and
# holds it while the Bot answers; when that grows, the process that grows is the one WITHOUT a
# limit, and the kernel's OOM killer then picks the largest process on the box — which is
# Postgres, whose death is the product's death. A ceiling per service turns "the machine is out
# of memory" into "this one container restarts", which is what `restart: unless-stopped` is for.
#
# The numbers are ceilings, not reservations: measured 2026-09-10 on the :stable images
# (`docker stats`), the whole stack idles at ~440MB — server 215, computer 97, postgres 69,
# agent-bot 45, web 14 — so each limit is several times its service's idle, and the sum of the
# five long-lived ones (3g + 1.5g + 1g + 512m + 256m = 6.25g) exceeds the box only on paper: the
# swapfile is the margin, and a service is killed at ITS ceiling long before the box is at its
# own. Compose v2 honours both spellings outside swarm, `mem_limit` and
# `deploy.resources.limits.memory`; the short one is used, and `docker inspect` reads it back as
# `HostConfig.Memory` (measured 2026-09-10, compose 5.1.1). Docker allows swap up to the same
# amount again by default (`MemorySwap` = 2 × `Memory`), so a limit of 1g is 1g of RAM and up to
# 1g of the swapfile before the kill.
#
# Postgres also carries an `oom_score_adj` below zero, so that when the HOST runs out — the
# global killer, not a cgroup's — it is the last of these the kernel chooses.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      # From .env, defaulting to the value every existing deployment already has, so this file can
      # be updated under a running VM without the database refusing its own password. A deployment
      # that wants its own sets POSTGRES_PASSWORD before the volume is first created — changing it
      # afterwards needs `ALTER USER` inside the running database, because the password lives in
      # the volume and not in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbot}
    logging: *logging
    # PostgreSQL's own default, left alone for a deployment: one VM runs one API server process and
    # never comes near 100. It is a knob because one test run peaks at 67 connections — every test
    # file that touches the database holds its own small pool for the length of the run — so two
    # gates at once exhaust the default and fail with "sorry, too many clients already", which reads
    # as a broken test and is a full connection table. Parallel local runs want 300; see
    # docs/development.md.
    #
    # The rest are the image's defaults re-set for a 6GB machine rather than the 2005 laptop they
    # were chosen for. `shared_buffers` 128MB → 256MB (a quarter of this service's ceiling, the
    # usual rule); `effective_cache_size` 4GB → 768MB, since the planner should count on the page
    # cache this cgroup can actually hold and not on a box it does not have; `random_page_cost`
    # 4 → 1.1 because the block volume is SSD and 4 is the number for spinning disks, which made
    # the planner shun index scans it should have taken; `work_mem` 4MB → 8MB for the sorts on the
    # trail and the run tables. `log_min_duration_statement` 1000 writes any statement that took a
    # second or more to the container log — the first thing to read when "the Bot got slow".
    # `tests/compose.test.ts` walks the list.
    command:
      [
        "postgres",
        "-c",
        "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "effective_cache_size=768MB",
        "-c",
        "work_mem=8MB",
        "-c",
        "random_page_cost=1.1",
        "-c",
        "log_min_duration_statement=1000",
      ]
    # 1g: shared_buffers plus a working set for one API process, and the page cache the cgroup is
    # charged for on top — reclaimable, so it does not count toward the kill. The one service the
    # host's own OOM killer should reach for last; see the note on x-logging.
    mem_limit: 1g
    oom_score_adj: -500
    # Docker's default /dev/shm is 64MB, and that is where Postgres puts the memory a parallel
    # query shares between its workers (`dynamic_shared_memory_type = posix`). With `work_mem`
    # raised above, a parallel hash join on the trail can want more than 64MB of it at once and
    # fails with "could not resize shared memory segment … No space left on device" — a query
    # error that reads as a broken screen. 256MB is the usual container-side answer; it is a
    # ceiling on a tmpfs, not memory taken.
    shm_size: 256m
    ports:
      # Loopback only. Nothing off this host has any business here: the API reaches the database as
      # `postgres:5432` on the compose network, and a person on the VM reaches it through the tunnel
      # they are already in. Published on every interface, the sole lock was the cloud ingress list,
      # and a rule there widened by a range rather than a port reaches the credential vault. A host
      # `INPUT` firewall is no second lock either — Docker publishes by DNAT, so the packet is
      # forwarded rather than delivered locally and never meets those rules.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # A person's VM reboots; their Bots are supposed to still be there when it does.
    restart: unless-stopped

  migrate:
    image: ghcr.io/laf-labs/openbot-server:${IMAGE_TAG:-stable}
    build:
      context: .
      dockerfile: server/Dockerfile
    # drizzle-kit's migrate, behind one read of its ledger: a database already at the newest
    # migration exits at once instead of loading drizzle-kit to find nothing to do (1.1 s → 0.6 s
    # measured on a 1-OCPU VM, paid by every `up`; server/scripts/migrate.ts). Anything else, a
    # fresh database included, goes to `drizzle-kit migrate` exactly as before.
    command: ["bun", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD:-openbot}@postgres:5432/openbot
    logging: *logging
    # drizzle-kit reads the journal and applies what is missing in one transaction; measured
    # under 200MB. A ceiling anyway, so a migration that somehow does not fit says so in the
    # container's exit rather than by taking the database with it.
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The API. Deliberately unpublished: the only way in is the web service's proxy, so a deployment
  # opens exactly one pair of ports however many services it runs.
  server:
    # Built by CI and pulled here: a deployment runs `docker compose pull` and never compiles.
    # The build block stays for development — `docker compose build` produces the same name, so
    # the two workflows share one file. IMAGE_TAG names the channel: stable (released), edge
    # (main), or a version tag.
    image: ghcr.io/laf-labs/openbot-server:${IMAGE_TAG:-stable}
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # Arms two refusals that are otherwise only warnings: the public example encryption key, and
      # LAF_DEV_NO_AUTH. Both are survivable mistakes locally and neither is survivable here,
      # so a deployment says which one it is rather than hoping nobody copied a development .env.
      NODE_ENV: production
      # Which channel this image was pulled by, so the `boot` log line can say which build is
      # running. The same variable names the image above; passing it in is what lets the log
      # agree with the pull (docs/laf/operating.md).
      IMAGE_TAG: ${IMAGE_TAG:-stable}
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD:-openbot}@postgres:5432/openbot
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      # What the tokens a sign-in stores are sealed under. Unconditional, unlike the sign-in pair
      # below: the server refuses to start without it whether or not a provider is declared, and the
      # fleet mints it at provision (`openssl rand -hex 32`) before any domain exists.
      LAF_TOKEN_ENCRYPTION_KEY: ${LAF_TOKEN_ENCRYPTION_KEY:-}
      TENANT_PACKAGE_DIR: ${TENANT_PACKAGE_DIR:-../tenant/laf}
      # Every Bot a person creates is answered here. Only package-shipped Bots are built in.
      MANAGED_AGENT_AG_UI_URL: http://agent-bot:4200/ag-ui
      # The Bot's browser. Absent, the failure waits until somebody presses hand-over.
      AGENT_COMPUTER_URL: http://agent-computer:4100
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      # Sign-in issues cookies for this exact string, scheme included: to a browser https://host
      # and host are different origins, and the mismatch reads as a session that never sticks.
      #
      # Both appear only when a provider is declared, because the API treats a partial auth
      # configuration as more dangerous than none — somebody meant to configure it and got it
      # wrong. Passing the origin unconditionally is how this file first refused to start a
      # deployment that had simply not set up OAuth yet, with an error naming the wrong value.
      BETTER_AUTH_URL: ${AUTH_PROVIDERS:+${PUBLIC_ORIGIN}}
      BETTER_AUTH_SECRET: ${AUTH_PROVIDERS:+${BETTER_AUTH_SECRET}}
      TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      # Which sign-ins this deployment offers — there is no email-and-password path, so without at
      # least one nobody can get in at all. AUTH_PROVIDERS declares the set (e.g. "google,kakao");
      # the server publishes it on /api/auth/providers for the surface to draw its buttons from,
      # and refuses to start if the declaration and the credentials disagree. Redirect URI per
      # provider: the origin plus /api/auth/callback/<provider>.
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID:-}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET:-}
      NAVER_OAUTH_CLIENT_ID: ${NAVER_OAUTH_CLIENT_ID:-}
      NAVER_OAUTH_CLIENT_SECRET: ${NAVER_OAUTH_CLIENT_SECRET:-}
      # The fleet's login broker, as AUTH_PROVIDERS=laf: issuer plus a PUBLIC
      # client id (PKCE carries the proof), no secret to pass.
      LAF_OIDC_ISSUER: ${LAF_OIDC_ISSUER:-}
      LAF_OIDC_CLIENT_ID: ${LAF_OIDC_CLIENT_ID:-}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      SIGN_IN_ALLOWED_EMAILS: ${SIGN_IN_ALLOWED_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      BOT_MODEL: ${BOT_MODEL:-}
      AGENT_STALL_TIMEOUT_MS: ${AGENT_STALL_TIMEOUT_MS:-}
      # Four settings the server reads and this file did not pass, which made them settings that
      # exist on a laptop and nowhere else: on a VM they were permanently the built-in default,
      # whatever the person's .env said. Empty is not "no value" for any of them — each falls back
      # to the one default in the code or in the tenant package, so the default stays in one place
      # and this file only carries it across the container boundary.
      #
      # SERVER_MODEL is the small, fast model this server asks on its own account when Jev is off or
      # cannot answer — the auto-review judge and compaction's stand-in (tenant model.yaml
      # `server_model`, GLM-5.3-Flash unset); SERVER_MODEL_EFFORT says whether it takes an effort.
      # REVIEW_MODEL overrides it for the judge alone.
      SERVER_MODEL: ${SERVER_MODEL:-}
      SERVER_MODEL_EFFORT: ${SERVER_MODEL_EFFORT:-}
      REVIEW_MODEL: ${REVIEW_MODEL:-}
      # The agent harness (docs/laf/eval-pack.md). JEV_ENABLED is the privacy switch for TypeSafe's
      # Jev (US-hosted): on unless it says `off`, since 2026-09-25. COMPACTION and its threshold
      # decide how a long conversation stops carrying old tool results.
      JEV_ENABLED: ${JEV_ENABLED:-}
      COMPACTION: ${COMPACTION:-}
      COMPACTION_THRESHOLD_TOKENS: ${COMPACTION_THRESHOLD_TOKENS:-}
      # A new epoch on a summary at the owner's local day boundary; on unless it says `off`.
      DAY_EPOCHS: ${DAY_EPOCHS:-}
      BOT_MODEL_EFFORT: ${BOT_MODEL_EFFORT:-}
      # Whether the model sees photos the owner attaches (tenant/laf/model.yaml `supports_images`).
      BOT_MODEL_IMAGES: ${BOT_MODEL_IMAGES:-}
      COMPUTER_REPEAT_WINDOW_MS: ${COMPUTER_REPEAT_WINDOW_MS:-}
      AGENT_COMPUTER_POLICY: ${AGENT_COMPUTER_POLICY:-}
      # The zone the Bot is told the time in. Asia/Seoul unless a deployment says otherwise.
      BOT_TIME_ZONE: ${BOT_TIME_ZONE:-}
      # Where "a Bot is blocked on you" is delivered while the AlimTalk channel is still in review.
      # Passed through because it was not: the server has always read it and no deployment could
      # set it, so every question waited silently on a surface nobody was looking at.
      LAF_NOTIFY_WEBHOOK_URL: ${LAF_NOTIFY_WEBHOOK_URL:-}
      # Where the 문의·의견 box reaches the operator: the fleet's alert webhook, the same address
      # `laf watch` posts to. Unset keeps the message on the deployment and tells nobody.
      LAF_ALERT_WEBHOOK_URL: ${LAF_ALERT_WEBHOOK_URL:-}
      # The partner vendor LAF holds the ACCOUNT at, for the whole fleet: 솔라피 for 카카오 알림톡.
      # The business never obtains a key — it connects its own 카카오톡 채널 under LAF's account, on
      # the 연결 screen.
      #
      # Unset, no card is drawn and no Bot tool exists, which is a correct deployment. The server
      # refuses to start on HALF of it: a 솔라피 key that is not `apiKey:apiSecret`, or a base URL
      # with no key behind it. See docs/laf/connections.md.
      LAF_ALIMTALK_API_KEY: ${LAF_ALIMTALK_API_KEY:-}
      LAF_ALIMTALK_BASE_URL: ${LAF_ALIMTALK_BASE_URL:-}
      LAF_ALIMTALK_FROM: ${LAF_ALIMTALK_FROM:-}
      # The public data portal's key (나라장터 입찰공고, 기업마당 지원사업), LAF's one for the fleet.
      # Nobody connects anything: set, every Bot on this VM is offered the two search tools at
      # boot; unset, there is no entry. The encoded spelling, as issued — the server refuses to
      # start on the decoded one. See docs/laf/connections.md.
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      # The deployment's own name, and the one thing the fleet identifies a customer by. The web
      # service has always had it; the API server needs it too now that it signs notices with it.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # Where a sign-up and a withdrawal reach the fleet tool, which is the only thing that can
      # create or destroy this machine. Unset, a person who leaves is gone from the database and the
      # VM outlives them — the server says so once at boot rather than leaving it to be discovered
      # on an invoice. The secret is required once the URL is set (it signs the body, and the
      # endpoint on the other end destroys machines); the server refuses to start without it.
      LAF_FLEET_WEBHOOK_URL: ${LAF_FLEET_WEBHOOK_URL:-}
      LAF_FLEET_WEBHOOK_SECRET: ${LAF_FLEET_WEBHOOK_SECRET:-}
      # The other direction: the bearer the fleet reads `GET /api/admin/metrics/insights` with —
      # counts and catalogue codes, never content. Unset, the route is not mounted at all.
      LAF_FLEET_METRICS_TOKEN: ${LAF_FLEET_METRICS_TOKEN:-}
      # The fleet's own OAuth application for Cafe24, and where relayed vendors send the browser
      # back. Google's pair is already passed above for sign-in and is the SAME application these
      # connectors consent under — one client, one console, both callbacks registered on it.
      #
      # Unset, those entries simply do not appear on the 연결 screen, which is correct on a laptop:
      # a button in front of a vendor with no application behind it opens a consent that ends in
      # `invalid_client`. The relay is the one address a fleet-wide client can have registered,
      # since no vendor accepts `*.agent.laf-co.com` — see docs/laf/connections.md.
      CAFE24_CLIENT_ID: ${CAFE24_CLIENT_ID:-}
      CAFE24_CLIENT_SECRET: ${CAFE24_CLIENT_SECRET:-}
      LAF_OAUTH_RELAY_URL: ${LAF_OAUTH_RELAY_URL:-}
      LAF_PRODUCT_DOMAIN: ${LAF_PRODUCT_DOMAIN:-}
      # How long the trail and the run records are kept, in days. Empty is 365 (the decision in
      # docs/laf/redesign-2026-09.md §7-7); 0 keeps everything and switches the nightly sweep off.
      # The notification outbox rides the same sweep on a fixed thirty days of its own.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      # A free trial, written by the fleet at provision and pushed again by `laf trial extend` and
      # `laf trial budget` — all four or none, and the server refuses to start on any other shape.
      # Unset on every deployment that is not a trial. Passed here because a push that restarts the
      # server restarts nothing a name compose does not hand over (laf-control README §3.8's scar).
      # What each one does: .env.example, and docs/laf/data-lifecycle.md for the trial itself.
      LAF_PLAN: ${LAF_PLAN:-}
      LAF_TRIAL_ENDS_AT: ${LAF_TRIAL_ENDS_AT:-}
      LAF_TRIAL_HOLD_DAYS: ${LAF_TRIAL_HOLD_DAYS:-}
      LAF_DAILY_TOKEN_BUDGET: ${LAF_DAILY_TOKEN_BUDGET:-}
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent-bot:
        condition: service_healthy
      agent-computer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:3001/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # Checked every second while it starts, and every ten once it is up (see HEALTH WHILE
      # STARTING under agent-bot).
      start_period: 60s
      start_interval: 1s
    # The process that holds a conversation in memory while a Bot answers it, and the one that
    # grows with the trail. 1.5g is several times its idle; past it the kernel restarts this one
    # container and Postgres does not notice.
    mem_limit: 1536m
    restart: unless-stopped

  # The only service published to the internet: TLS, the built app, and the proxy to the API.
  # `postgres`, `agent-bot` and `agent-computer` publish too, but each binds 127.0.0.1, so 80 and
  # 443 here are the whole of this deployment's routed surface.
  #
  # It depends on NOTHING, on purpose. It used to wait for the API's container to exist, which
  # read as harmless — but the API waits for the migration to succeed, and compose does not start
  # a service whose dependency failed. So one failed migration closed 80 and 443 along with the
  # API: measured 2026-09-10, `docker compose up -d` against a database whose migration table had
  # been dropped ended with `dependency failed to start`, and with the dependency in place the
  # front door was never created — the fleet monitor, written to read what the front door answers,
  # saw connection refused, and a person at the address saw a browser error rather than the app.
  # Caddy resolves `server` per request, and while it is absent `/health` answers 503
  # `{"status":"down","checks":{"api":"unreachable"}}` (`handle_errors` in app/Caddyfile), the answer
  # deploying.md documents for "the API is not there"; a front door that refuses to open while the
  # kitchen is broken is worse than one that says so — and the certificate cannot be issued or
  # renewed at all until this is listening on 80.
  # `tests/compose.test.ts` asserts the absence.
  web:
    image: ghcr.io/laf-labs/openbot-web:${IMAGE_TAG:-stable}
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        # The surface's FALLBACK list of sign-in buttons, compiled in. The buttons actually drawn
        # come from the server (`GET /api/auth/providers`), which reads the same variable below at
        # run time — so a deployment that changes its set restarts, and rebuilds only if it wants
        # the fallback to match too.
        AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy's site address and the API's cookie origin are the same value, so they cannot drift.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # The www name only ever redirects to the apex. The default is at this layer, not just in
      # the Caddyfile, so an empty value from a bare `.env` line cannot become an empty site block.
      PUBLIC_WWW_ORIGIN: ${PUBLIC_WWW_ORIGIN:-http://www.localhost}
      # "1" on a standing spare, and only there: every path answers 503 and nothing is proxied until
      # the claim writes the person's lines and removes this one (app/Caddyfile, THE LOCK). Unset and
      # empty both mean open, so a deployment that never heard of it is unchanged.
      LAF_FRONT_LOCKED: ${LAF_FRONT_LOCKED:-}
    volumes:
      # Certificates and the ACME account. Without this volume a restart re-requests the same
      # certificate, and five of those in a week is a Let's Encrypt rate limit measured in days.
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging
    # The front door had no health of its own, so `docker compose ps` called it up while it was
    # serving nothing — and the front door is the one service whose death is the whole product's
    # death.
    #
    # It then asked Caddy's own admin API whether a configuration was loaded, which is a different
    # question and one that cannot be answered no. Measured 2026-09-06, both commands run against
    # the same stopped API: this one exits 1, that one exits 0 — the same lie the SPA fallback was
    # telling at /health, one layer down. A dial that cannot go red is not a dial.
    #
    # So it asks the front door the question the internet asks it, through the address app/Caddyfile
    # keeps for this and publishes nowhere. Red when the API is gone (503 `down`, from here), red
    # when the API is degraded (503 `degraded`, from the API), red when Caddy is not routing at all.
    # wget is busybox's, already in the alpine image, and exits non-zero on an HTTP error status;
    # `-O /dev/null` rather than `--spider`, which sends a HEAD the API's GET route does not answer.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:2021/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The API waits on migrations and on two other containers being healthy, so a cold boot spends
      # a while with nothing behind this door. Failures in here do not count against `retries`.
      start_period: 60s
      start_interval: 1s
    # Caddy: a few tens of MB idle, TLS and compression on top. The smallest ceiling here, and the
    # one whose death matters most — which is why it is generous relative to what it uses.
    mem_limit: 256m
    restart: unless-stopped

  # The Bot's computer is long-lived so browser sessions remain signed in across turns.
  agent-computer:
    build:
      context: .
      dockerfile: agent-computer/Dockerfile
    image: ${COMPUTER_IMAGE:-ghcr.io/laf-labs/openbot-agent-computer:${IMAGE_TAG:-stable}}
    ports:
      # Loopback only. This process drives a browser holding real logins; COMPUTER_TOKEN is the
      # request control, and loopback keeps the surface off routed networks.
      - "127.0.0.1:${COMPUTER_PORT:-4100}:4100"
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-stable}
      # The secret every caller must present. The container refuses to start without it.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      # The same variable the API server reads, because the browser has a clock too: without it
      # Chromium ran on UTC and every Korean site the Bot opened rendered yesterday's date after
      # 09:00 KST. Empty falls back to Asia/Seoul in the code, so the default lives in one place.
      BOT_TIME_ZONE: ${BOT_TIME_ZONE:-}
      # The browser judges every navigation hop itself — a public redirector used to be one 302
      # away from 127.0.0.1 (audit A3, 2026-09-10) — with the same floor and the same opt-in the
      # API server applies to the address a Bot asks for. Empty is off, which is what a hosted
      # deployment wants; a laptop that sets it for the server sets it here with the same word.
      AGENT_COMPUTER_ALLOW_PRIVATE_HOSTS: ${AGENT_COMPUTER_ALLOW_PRIVATE_HOSTS:-}
      # The container's own egress firewall (agent-computer/egress-firewall.sh). Empty is on; `off`
      # is for a runtime that cannot grant NET_ADMIN, and is logged at every start.
      AGENT_COMPUTER_EGRESS_FIREWALL: ${AGENT_COMPUTER_EGRESS_FIREWALL:-}
    # THE ONE CAPABILITY ADDED, AND ONLY FOR THE FIRST SECOND. The entrypoint writes the egress
    # firewall into this container's network namespace — nothing the browser requests may reach
    # 169.254.169.254, RFC 1918, CGNAT or the host, whatever a name resolved to (security review
    # 2026-09-25 F1: DNS rebinding and subresources walk past the navigation guard) — and then runs
    # the computer as `pwuser` with an empty bounding set and no_new_privs, so no process under it
    # holds NET_ADMIN or can get it back. Without the capability the container refuses to start.
    cap_add:
      - NET_ADMIN
    volumes:
      - agent-workspace:/workspace
      # Chromium's user-data directory is volume-backed so logins survive container restarts.
      - agent-profiles:/profiles
    logging: *logging
    # A browser is the one process here that can eat the machine. The recommended VM is 6GB plus a
    # 4GB swapfile and the whole stack idles at 1.1GB, so 3GB is roughly "Chromium may take half of
    # this machine and no more": past that the kernel kills the browser, which restarts, rather than
    # killing whatever the OOM killer picks — which on a box like this is Postgres.
    mem_limit: 3g
    # Threads as well as processes — the kernel counts both. Measured 2026-09-10 (audit A3): five
    # Bots' browsers after twenty navigations each were 332 tasks, twelve browsers 660. A thousand is
    # every seat plus a browser or two lingering to its idle close, and a ceiling under a page that
    # forks without end, which mem_limit alone does not stop.
    pids_limit: 1024
    # AN INIT AS PID 1, BECAUSE BUN IS NOT ONE. A closed browser's zygotes are orphaned to PID 1, and a
    # PID 1 that does not reap them keeps every one as a zombie. Measured 2026-09-13: five Bots'
    # browsers closed by deleting the Bots left ten `[headless_shell] <defunct>` under `bun`, and every
    # idle close adds more — which the pid ceiling above would turn, some days later, into a computer
    # that cannot start a browser at all. Docker's own init reaps them and passes SIGTERM on to `bun`.
    init: true
    # Chromium's sandbox on Linux is user namespaces, and Docker's default seccomp profile refuses
    # them to an unprivileged process — which is why this image ran the browser as root with
    # `--no-sandbox` until 2026-09-13. This is Playwright's published profile for exactly this
    # (`utils/docker/seccomp_profile.json` at v1.62.1, the same JSON): Docker's default plus the user
    # namespace syscalls. Measured on Ubuntu 24.04 aarch64 with `apparmor_restrict_unprivileged_userns=1`
    # and Docker 29.8, as `pwuser`: without it Chromium exits with "No usable sandbox!"; with it every
    # renderer runs in a user, PID and network namespace of its own. No AppArmor change is needed.
    # The path is read on the host, so the file rides in the deploy bundle beside this one.
    security_opt:
      - seccomp=./agent-computer/seccomp_profile.json
    # THE VOLUMES, HANDED TO THE USER THE COMPUTER NOW RUNS AS. Every deployment that ran the image
    # before 2026-09-13 has `agent-profiles` and `agent-workspace` owned by root, and a computer that
    # starts as `pwuser` cannot open a root-owned profile — every Bot's logins would be unreadable
    # after the upgrade. So this runs once per `up`, as root and only this command, right after the
    # container starts and before anything asks for a browser (the server waits for the healthcheck,
    # and nothing here touches either volume at boot). `--from=root` makes it a no-op on a volume that
    # is already right: a fresh one takes the image's ownership, and every later file is pwuser's.
    post_start:
      - command:
          ["chown", "-R", "--from=root", "pwuser:pwuser", "/profiles", "/workspace"]
        user: root
    # Docker's default /dev/shm is 64MB, which Chromium exhausts on ordinary pages. The launch args
    # pass --disable-dev-shm-usage so it writes to /tmp instead and survives; this makes the shared
    # memory real, so it does not have to.
    shm_size: 1g
    # Chromium's disk cache is bounded now: `--disk-cache-size=100MB` is in the launch args in
    # agent-computer/src/profiles.ts, where the rest of them are. It stayed a code change rather
    # than becoming another variable here — a cache size is not something a deployment tunes.
    # A browser nobody has used for ten minutes closes itself, which is the other half of this.
    # Gives Chromium time to flush its profile after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 30s
    # `r.ok`, not merely "it answered": a bare `await fetch(...)` resolves on a 503 as happily as on
    # a 200, so the dial could not go red for anything short of the port being closed. Measured
    # 2026-09-10 (audit A5 §9): 503 → exit 0. The `web` healthcheck's `wget` fails on an HTTP error
    # status for the same reason.
    #
    # Every second while starting, every thirty after (the image's own HEALTHCHECK says why): the
    # server's `service_healthy` wait sees it ready as soon as it is, and an idle computer no longer
    # starts a `bun` every few seconds to ask.
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:4100/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    # A person's VM reboots; their Bots are supposed to still be there when it does.
    restart: unless-stopped

  # The built-in Bot is an AG-UI endpoint registered the same way as a customer-provided Bot.
  agent-bot:
    image: ghcr.io/laf-labs/openbot-agent-bot:${IMAGE_TAG:-stable}
    build:
      context: .
      dockerfile: agent-bot/Dockerfile
    ports:
      # Loopback only, for the same reason as the computer: this endpoint answers with the
      # deployment's model key and asks nobody who they are. The API calls it as `agent-bot:4200`
      # on the compose network, which a publish bind does not touch, and the only other caller is
      # `scripts/start.sh` health-checking `localhost` on the host itself.
      - "127.0.0.1:${BOT_PORT:-4200}:4200"
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-stable}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Unset means OpenAI. Set, it is any endpoint speaking the same API, and BOT_MODEL is sent
      # to it verbatim.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # No default here. There were four of them across this repository and they disagreed —
      # `gpt-5.5` in this file, `gpt-5.5` in the Bot, `gpt-4.1` in the tenant package, and
      # `z-ai/glm-5.3-flash` in the .env every deployment actually runs. The deployment's model is
      # one decision, so it is written once: the tenant package's model.yaml carries the fallback
      # the server reads, and this Bot refuses to start rather than answering on a model nobody
      # chose. Set BOT_MODEL in .env; .env.example ships it set.
      BOT_MODEL: ${BOT_MODEL:-}
      # Which OpenRouter endpoints may answer, keyed by model (agent-bot/src/provider.ts). Unset,
      # or no line for BOT_MODEL, sends nothing.
      BOT_PROVIDER_POLICY: ${BOT_PROVIDER_POLICY:-}
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:4200/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # HEALTH WHILE STARTING. The first check used to run a full `interval` after the start, so
      # every `up` waited ten seconds for agent-bot and agent-computer before the server could start,
      # and another ten before the server read as healthy. Measured 2026-09-26 on a 1-OCPU VM: 23.3 s
      # from `up` to an answering server, against about 7 s with a check every second while the
      # service is starting. `start_period` only bounds how long the fast checks run, and a failure
      # inside it does not count against `retries`. Once the first check passes, the interval goes
      # back to ten seconds. Needs Docker 25 or later (the VMs run 29.8).
      start_period: 60s
      start_interval: 1s
    # One turn in flight at a time per Bot, each carrying the conversation the API handed it.
    # Several times its idle.
    mem_limit: 512m
    # A person's VM reboots; their Bots are supposed to still be there when it does.
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  agent-workspace:
  agent-profiles:
